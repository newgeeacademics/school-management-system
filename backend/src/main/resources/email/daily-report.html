<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:32px 16px;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
  <div style="display:none;max-height:0;overflow:hidden;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="580" cellpadding="0" cellspacing="0" style="max-width:580px;width:100%;background:#ffffff;border-radius:10px;border:1px solid #e4e4e7;overflow:hidden;">
          <tr>
            <td style="height:4px;background:#18181b;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:24px 32px 20px 32px;border-bottom:1px solid #f4f4f5;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-right:12px;vertical-align:middle;">
                    <img src="{{logoUrl}}" alt="NewGee" width="44" height="44" style="display:block;border-radius:8px;">
                  </td>
                  <td style="vertical-align:middle;">
                    <p style="margin:0;font-size:16px;font-weight:600;color:#18181b;">NewGee</p>
                    <p style="margin:2px 0 0 0;font-size:13px;color:#71717a;">Rapport plateforme</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 32px;">
              <h1 style="margin:0 0 20px 0;font-size:20px;font-weight:600;color:#18181b;line-height:1.35;">{{subject}}</h1>
              {{body}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 32px 28px 32px;">
              <a href="{{appUrl}}" style="display:inline-block;padding:10px 20px;font-size:14px;font-weight:500;color:#ffffff;background:#2563eb;text-decoration:none;border-radius:8px;">Administration</a>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#fafafa;border-top:1px solid #f4f4f5;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#a1a1aa;">Rapport généré automatiquement · © {{year}} NewGee</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
