<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:32px 16px;background:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
  <div style="display:none;max-height:0;overflow:hidden;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table role="presentation" width="580" cellpadding="0" cellspacing="0" style="max-width:580px;width:100%;background:#ffffff;border-radius:10px;border:1px solid #e4e4e7;overflow:hidden;">
          <tr>
            <td style="height:4px;background:#2563eb;font-size:0;line-height:0;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:28px 32px;">
              <p style="margin:0 0 12px 0;font-size:18px;font-weight:600;color:#18181b;">{{subject}}</p>
              <div style="font-size:15px;line-height:1.65;color:#3f3f46;">{{body}}</div>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;background:#fafafa;border-top:1px solid #f4f4f5;">
              <p style="margin:0;font-size:12px;color:#a1a1aa;">© {{year}} NewGee</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
